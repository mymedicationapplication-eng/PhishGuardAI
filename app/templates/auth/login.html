{% extends "base.html" %}
{% block title %}Login | PhishGuard{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card-grid">
            <div class="auth-form-panel">
                <div class="auth-card-header text-center">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" class="auth-card-logo" alt="PhishGuard Logo">
                </div>
                <h3 class="text-center">Sign in to PhishGuard</h3>
                <form method="post" class="vstack gap-3 mt-3">
                    <div>
                        <label class="form-label">Email address</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input class="form-control" type="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="position-relative">
                        <label class="form-label">Password</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input class="form-control password-input" type="password" name="password" placeholder="Enter your password" required>
                        </div>
                        <button type="button" class="password-toggle-icon" aria-label="Show password"><i class="bi bi-eye"></i></button>
                        <div class="text-end mt-2 small"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a></div>
                    </div>
                    <button class="btn btn-primary btn-lg w-100 mt-2" type="submit">Sign In</button>
                </form>
                <div class="mt-3 small text-center text-muted">
                    New to PhishGuard? <a href="{{ url_for('auth.register') }}">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
