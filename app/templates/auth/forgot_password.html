{% extends "base.html" %}
{% block title %}Reset Password | PhishGuard{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card-grid single-auth">
            <div class="auth-form-panel">
                <div class="auth-card-header text-center mb-4">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" class="auth-card-logo" alt="PhishGuard Logo">
                    <div class="hstack justify-content-center gap-2 text-secondary mb-2">
                        <i class="bi bi-key-fill"></i>
                        <strong>Password recovery</strong>
                    </div>
                </div>
                <span class="eyebrow-badge">Password recovery</span>
                <h3 class="mt-3 mb-2">Reset your password</h3>
                <p class="text-muted mb-4">Enter your account email and choose a new password.</p>
                <form method="post" class="vstack gap-3">
                    <div>
                        <label class="form-label">Email address</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input class="form-control" type="email" name="email" required>
                        </div>
                    </div>
                    <div>
                        <label class="form-label">New password</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input class="form-control password-input" type="password" name="new_password" minlength="8" required>
                            <button type="button" class="btn btn-outline-secondary toggle-password" aria-label="Show password"><i class="bi bi-eye"></i></button>
                        </div>
                    </div>
                    <button class="btn btn-primary btn-lg">Update Password</button>
                </form>
                <div class="small mt-4">
                    <a href="{{ url_for('auth.login') }}">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
