{% extends "base.html" %}
{% block title %}Register | PhishGuard{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<section class="auth-section">
    <div class="container">
        <div class="auth-card-grid">
            <div class="auth-form-panel">
                <div class="auth-card-header text-center">
                    <img src="{{ url_for('static', filename='img/logo.png') }}" class="auth-card-logo" alt="PhishGuard Logo">
                </div>
                <h3 class="text-center mb-1">Create your account</h3>
                <form method="post" class="vstack gap-2 mt-1">
                    <div>
                        <label class="form-label mb-1">Full name</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input class="form-control" type="text" name="full_name" placeholder="Your full name" required>
                        </div>
                    </div>
                    <div>
                        <label class="form-label mb-1">Email address</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                            <input class="form-control" type="email" name="email" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="position-relative" style="margin-bottom: -0.5rem;">
                        <label class="form-label mb-1">Password</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input class="form-control password-input" type="password" name="password" minlength="8" placeholder="Create a password" required>
                        </div>
                        <button type="button" class="password-toggle-icon" aria-label="Show password"><i class="bi bi-eye"></i></button>
                        <div class="text-end" style="visibility: hidden; height: 0.5rem;">Spacing</div>
                    </div>
                    <div class="position-relative">
                        <label class="form-label mb-1">Confirm password</label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                            <input class="form-control password-input" type="password" name="confirm_password" minlength="8" placeholder="Confirm your password" required>
                        </div>
                        <button type="button" class="password-toggle-icon" aria-label="Show password"><i class="bi bi-eye"></i></button>
                        <div class="text-end" style="visibility: hidden; height: 0.5rem;">Spacing</div>
                    </div>
                    <button class="btn btn-primary btn-lg w-100" type="submit" style="margin-top: 0.5rem;" id="registerBtn">
                        <span class="btn-text">Create Account</span>
                        <span class="btn-spinner d-none">
                            <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                            Creating account...
                        </span>
                    </button>
                </form>
                <div class="mt-1 small text-center text-muted">
                    Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
